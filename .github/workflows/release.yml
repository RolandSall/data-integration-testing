name: Release
on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm distribution tag
        type: choice
        options: [beta, latest]
        default: latest
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run pack:check:docker
      - run: bun run test:runners:minimum
      - name: Verify repository examples against the packed package
        run: bun run test:consumer
      - name: Verify package version has not been published
        run: bun scripts/verify-release.ts
      - name: Publish with provenance
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: npm publish ./packages/data --provenance --access public --tag "$NPM_TAG"
      - name: Verify the published package with the standalone consumer
        run: bun run test:consumer:published
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create the version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          NPM_TAG: ${{ inputs.npm-tag }}
        shell: bash
        run: |
          version=$(node -p "require('./packages/data/package.json').version")
          existing_tag=$(git ls-remote origin "refs/tags/v$version")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag v$version already exists; inspect it before completing the release."
            exit 1
          fi
          options=(--latest=false)
          if [[ "$NPM_TAG" == "beta" || "$version" == *-* ]]; then
            options=(--prerelease --latest=false)
          elif [[ "$NPM_TAG" == "latest" ]]; then
            options=(--latest)
          fi
          gh release create "v$version" \
            --target "$RELEASE_COMMIT" \
            --title "$version" \
            --generate-notes \
            "${options[@]}"
