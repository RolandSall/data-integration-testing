name: Release
on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm distribution tag
        type: choice
        options: [beta, latest]
        default: latest
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run pack:check:docker
      - run: bun run test:runners:minimum
      - name: Verify repository examples against the packed package
        run: bun run test:consumer
      - name: Verify package version has not been published
        run: bun scripts/verify-release.ts
      - name: Publish with provenance
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: npm publish ./packages/data --provenance --access public --tag "$NPM_TAG"
